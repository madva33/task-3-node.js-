<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Weather Check</h1>
        <form id="form1">
            <input type="text" id="address" placeholder="Enter country or city name" required>
            <button type="submit">Get Weather</button>
        </form>
        <div id="error" class="error-message"></div>
        <div id="latitude" class="info"></div>
        <div id="longitude" class="info"></div>
        <div id="country" class="info"></div>
        <div id="condition" class="info"></div>
        <div id="temperature" class="info"></div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
